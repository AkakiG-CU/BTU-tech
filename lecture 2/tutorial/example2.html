<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Basics - Example 2</title>
</head>
<body>
    <h1>Text Formatting</h1>
    <p>
        <b>Bold</b> Text
    </p>
    <p>
        <i>Italicized Text</i>
    </p>
    
    <p>Out of Small<small>Smaller Text</small></p>
    <p>Out of Sub<sub>Subscript Text</sub></p>
    <p>Out of Sup<sup>Superscript Text</sup></p>
</body>
</html>
