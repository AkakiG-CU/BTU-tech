<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Animations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>@keyframes and timing functions</h1>
  <h2>Transition (hover)</h2>
  <div class="hover-card">Hover me</div>
  
  <h2>Keyframes with timing functions</h2>
  <div class="row">
    <div class="box linear">linear</div>
    <div class="box ease">ease</div>
    <div class="box ease-in">ease-in</div>
    <div class="box ease-out">ease-out</div>
    <div class="box ease-in-out">ease-in-out</div>
    <div class="box step-start">step-start</div>
    <div class="box step-end">step-end</div>
    <div class="box bezier">cubic-bezier</div>
  </div>
</body>
</html>
