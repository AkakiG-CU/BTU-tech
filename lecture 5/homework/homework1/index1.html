<!DOCTYPE html>
<html lang="eng">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Card Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    
    <div class="header">
      <div class="user-info">
        <div class="avatar"></div>
        <div class="names">
          <span class="display-name">Your Name <span class="verified">✔</span></span>
          <span class="username">@username</span>
        </div>
      </div>
      <div class="actions">
        <button class="subscribe-btn">Subscribe</button>
        <span class="more-options">•••</span>
      </div>
    </div>

    
    <div class="post-text">
      This is an example post. Blah blah blah. I know it's not the best template in the world, but at least it's free. Have fun using this for your project.<br>
      <a href="#" class="hashtag">#hashtag</a>
    </div>

    
    <div class="media-box"></div>

    
    <div class="meta-info">
      12:00 PM • Oct 14, 2023 • 200.1K Views 
    </div>

    
    <div class="footer-actions">
      <div class="action-item">💬 991</div>
      <div class="action-item">🔁 1,581</div>
      <div class="action-item">❤️ 9,867</div>
      <div class="action-item">🔖 90</div>
      <div class="action-item">📤</div>
    </div>
  </div>

</body>
</html>
