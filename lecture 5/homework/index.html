<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post Card</title>

        <!-- Bootstrap -->
  <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

      <!-- CSS -->
   <link rel="stylesheet" href="style.css">
    </head>

    <body>

    <div class="container">
    <div class="row">
    <div class="col">

    <div class="card">

        <!-- Header -->
    <div class="d-flex align-items-center mb-3">

    <div class="avatar"></div>

    <div class="ms-2">
    <div class="fw-bold">
        Your Name 
    </div>

    <small class="text-muted">
        @username
    </small>
    </div>

            <button class="btn btn-dark rounded-pill ms-auto">
                        Subscribe
            </button>

            <span class="ms-3">•••</span>

            </div>


            <!-- Text -->
            <div class="mb-2">
                This is an example post. Blah blah blah.
                I know it's not the best template in the world,
                    but at least it's free.
            </div>


            <!-- Hashtag -->
                <a href="#" class="mb-3">
                    #Hashtags
                </a>


                    <!-- Image -->
                <div class="post-image mb-3"></div>


                <!-- Info -->
                <small class="text-muted mb-3">
                    12:00 PM · Oct 14 2023 · 200.1K Views
                </small>


                <!-- Actions -->
                <div class="d-flex justify-content-between actions">

                        <span>♡ 991</span>
                        <span>↻  1.5K</span>
                        <span>♡ 9,867</span>
                        <span>Hashtags 40</span>
                        <span>↗</span>

                </div>

                </div>

                </div>
                </div>
                </div>

                </body>
                </html>
